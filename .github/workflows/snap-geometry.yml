name: snap sensor geometry
# Turns each road sensor into a stretch of real road (from OpenStreetMap) and saves
# data/sensor-geometry.json. Run it once, and again when BMA adds sensors.
on:
  workflow_dispatch:
    inputs:
      all:
        description: 'Redo every sensor, not just new ones'
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/snap-geometry.yml'
      - 'scripts/snap-geometry.js'
      - 'scripts/lib/geo.js'
permissions:
  contents: write
concurrency:
  group: snap-geometry
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Geometry tests
        run: node test/geo.test.js
      - name: Snap sensors to roads
        run: node scripts/snap-geometry.js ${{ inputs.all && '--all' || '' }}
      - name: Commit result
        run: |
          git config user.name flood-bot
          git config user.email flood-bot@users.noreply.github.com
          git add data/sensor-geometry.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update sensor road geometry"
          git push origin HEAD:${{ github.ref_name }}
