name: probe flood sensor site
on:
  push:
    paths: ['.github/workflows/probe.yml', 'scripts/probe.sh']
  workflow_dispatch:
permissions:
  contents: write
concurrency: flood-data
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/probe.sh
      - name: Commit probe results
        run: |
          git config user.name "flood-bot"
          git config user.email "flood-bot@users.noreply.github.com"
          git add -f probe
          git commit -m "Probe results from flood.larry-cctv.com" || exit 0
          git push
